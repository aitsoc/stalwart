name: "Build Variant Images (FDB)"

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR/Quay. When off, images are uploaded as downloadable artifacts instead."
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*.*.*"]

env:
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-fdb:
    name: Detect FDB Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fdb_version: ${{ steps.detect.outputs.fdb_version }}
      fdb_range: ${{ steps.detect.outputs.fdb_range }}
    steps:
      - name: Detect latest FoundationDB 7.4.x version
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FDB_VERSION=$(curl --retry 5 -fsSL -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github.v3+json" 'https://api.github.com/repos/apple/foundationdb/releases?per_page=100' | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for r in data:
              if r['tag_name'].startswith('7.4.') and not r.get('prerelease') and not r.get('draft'):
                  print(r['tag_name'])
                  break
          ")
          if [ -z "$FDB_VERSION" ]; then FDB_VERSION="7.4.8"; fi
          echo "Detected FoundationDB version: ${FDB_VERSION}"
          echo "fdb_version=${FDB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "fdb_range=${FDB_VERSION%.*}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # Phase 1: Build all-features binary for each arch
  # ─────────────────────────────────────────────────────
  build-binary:
    name: "Build Binary / ${{ matrix.target }}"
    needs: [detect-fdb]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            platform: linux/amd64
            build_env: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            platform: linux/arm64
            build_env: "JEMALLOC_SYS_WITH_LG_PAGE=16 "
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Free disk space (heavy ARM64 target)
        if: contains(matrix.target, 'aarch64')
        run: |
          df -h /mnt /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /mnt /

      - name: Add swap (heavy ARM64 target)
        if: contains(matrix.target, 'aarch64')
        run: |
          mnt_avail=$(df --output=avail -k /mnt | tail -1)
          if [ "$mnt_avail" -lt 18874368 ]; then
            echo "Insufficient space on /mnt (${mnt_avail}K available), aborting swap setup"
            exit 1
          fi
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=80
          free -h
          swapon --show

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]
          driver-opts: |
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Calculate shasum of external deps
        id: cal-dep-shasum
        run: |
          echo "checksum=$(yq -p toml -oy '.package[] | select((.source | contains("")) or (.checksum | contains("")))' Cargo.lock | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        id: cargo-cache
        with:
          path: |
            usr-local-cargo-registry
            usr-local-cargo-git
          key: cargo-cache-${{ steps.cal-dep-shasum.outputs.checksum }}

      - name: Inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "usr-local-cargo-registry": "/usr/local/cargo/registry",
              "usr-local-cargo-git": "/usr/local/cargo/git"
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' crates/main/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build all-features binary
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.binary
          target: binaries
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            TARGET=${{ matrix.target }}
            BUILD_ENV=${{ matrix.build_env }}
            FDB_VERSION_RANGE=${{ needs.detect-fdb.outputs.fdb_range }}
            FEATURES=sqlite,foundationdb,postgres,mysql,rocks,s3,redis,keep,azure,nats,exchange,enterprise,zenoh,kafka
          outputs: type=local,dest=${{ runner.temp }}/binary
          cache-from: type=gha,scope=binary-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=binary-${{ matrix.arch }}

      - name: List binary outputs
        run: ls -lh ${{ runner.temp }}/binary/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/binary/stalwart
            ${{ runner.temp }}/binary/libfdb_c.so
          if-no-files-found: error
          retention-days: 14

      - name: Write binary download note
        run: |
          echo "### Binary artifact (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`binary-${{ matrix.arch }}\`: stalwart + libfdb_c.so (retained 14 days)" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────
  # Phase 2: Build variant runtime images from pre-built binary
  # ─────────────────────────────────────────────────────
  build-image:
    name: "Build Image / ${{ matrix.variant }} / ${{ matrix.arch }}"
    needs: [build-binary, detect-fdb]
    runs-on: ${{ matrix.runner }}
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push }}
    permissions:
      id-token: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Ubuntu/Debian (amd64 + arm64) ──
          - variant: ubuntu
            arch: amd64
            platform: linux/amd64
            base_image: docker.io/library/debian:trixie-slim
            distro_family: debian
            image_suffix: ""
            runner: ubuntu-latest
          - variant: ubuntu
            arch: arm64
            platform: linux/arm64
            base_image: docker.io/library/debian:trixie-slim
            distro_family: debian
            image_suffix: "-arm64"
            runner: ubuntu-24.04-arm

          # ── RHEL (官方镜像, amd64) ──
          - variant: rhel9
            arch: amd64
            platform: linux/amd64
            base_image: registry.access.redhat.com/ubi9/ubi:9.8
            distro_family: rhel
            image_suffix: "-rhel9"
            runner: ubuntu-latest
          - variant: rhel10
            arch: amd64
            platform: linux/amd64
            base_image: registry.access.redhat.com/ubi10:10.2
            distro_family: rhel
            image_suffix: "-rhel10"
            runner: ubuntu-latest

          # ── Rocky Linux (RHEL 兼容, amd64) ──
          - variant: rocky9
            arch: amd64
            platform: linux/amd64
            base_image: rockylinux/rockylinux:9-ubi
            distro_family: rhel
            image_suffix: "-rocky9"
            runner: ubuntu-latest
          - variant: rocky10
            arch: amd64
            platform: linux/amd64
            base_image: rockylinux/rockylinux:10.1.20251123-ubi
            distro_family: rhel
            image_suffix: "-rocky10"
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' crates/main/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download binary artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/binary

      - name: Prepare Docker build context
        run: |
          mkdir -p ${{ runner.temp }}/context
          cp Dockerfile.runtime ${{ runner.temp }}/context/Dockerfile
          cp ${{ runner.temp }}/binary/stalwart ${{ runner.temp }}/context/stalwart
          chmod 755 ${{ runner.temp }}/context/stalwart
          # libfdb_c.so is downloaded from the official FoundationDB release
          # by Dockerfile.binary; no prebuilt copy is kept in the repository.
          if [ ! -s "${{ runner.temp }}/binary/libfdb_c.so" ]; then
            echo "::error::libfdb_c.so missing from the downloaded binary artifact"
            exit 1
          fi
          cp ${{ runner.temp }}/binary/libfdb_c.so ${{ runner.temp }}/context/libfdb_c.so
          ls -lh ${{ runner.temp }}/context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to Quay.io
        id: quay-login
        if: env.PUSH_IMAGES == 'true'
        continue-on-error: true
        uses: docker/login-action@v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Manual / no-push runs: export each image as a Docker image archive so it
      # can be downloaded from the workflow run and loaded with `docker load`.
      - name: Build image tarball (download artifact)
        if: env.PUSH_IMAGES != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: ${{ runner.temp }}/context/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          tags: stalwart-${{ matrix.variant }}:${{ steps.version.outputs.app_version }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            DISTRO_FAMILY=${{ matrix.distro_family }}
          outputs: type=docker,dest=${{ runner.temp }}/stalwart-${{ matrix.variant }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=image-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Upload image tarball
        if: env.PUSH_IMAGES != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stalwart-${{ matrix.variant }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14

      - name: Write image download note
        if: env.PUSH_IMAGES != 'true'
        run: |
          echo "### Image artifact (${{ matrix.variant }} / ${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`image-${{ matrix.variant }}-${{ matrix.arch }}\`: Docker image archive, load with \`docker load -i stalwart-${{ matrix.variant }}-${{ matrix.arch }}.tar\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push by digest (GHCR)
        id: build
        if: env.PUSH_IMAGES == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: ${{ runner.temp }}/context/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            DISTRO_FAMILY=${{ matrix.distro_family }}
          outputs: type=image,"name=ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=9,oci-mediatypes=true
          cache-from: type=gha,scope=image-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Push to Quay.io
        id: build-quay
        if: env.PUSH_IMAGES == 'true' && steps.quay-login.outcome == 'success'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: ${{ runner.temp }}/context/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            DISTRO_FAMILY=${{ matrix.distro_family }}
          outputs: type=image,"name=quay.io/offsec/stalwart",push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=9,oci-mediatypes=true
          cache-from: type=gha,scope=image-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digests
        if: env.PUSH_IMAGES == 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          ghcr_digest="${{ fromJSON(steps.build.outputs.metadata)['containerimage.digest'] }}"
          if [ -z "$ghcr_digest" ] || [ "$ghcr_digest" = "null" ]; then
            echo "::error::GHCR build did not return a digest"
            exit 1
          fi
          touch "${{ runner.temp }}/digests/ghcr-${ghcr_digest#sha256:}"
          if [ "${{ steps.quay-login.outcome }}" = "success" ]; then
            quay_digest="${{ steps.quay-login.outcome == 'success' && fromJSON(steps.build-quay.outputs.metadata)['containerimage.digest'] || '' }}"
            if [ -z "$quay_digest" ] || [ "$quay_digest" = "null" ]; then
              echo "::error::Quay build did not return a digest"
              exit 1
            fi
            touch "${{ runner.temp }}/digests/quay-${quay_digest#sha256:}"
          fi
          ls -la ${{ runner.temp }}/digests/

      - name: Upload digest
        if: env.PUSH_IMAGES == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────
  # Merge per-platform digests into manifest lists
  # ─────────────────────────────────────────────────────
  merge:
    name: "Merge / ${{ matrix.variant }}"
    needs: [build-image, detect-fdb]
    if: github.event_name == 'push' || inputs.push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
            image_suffix: ""
          - variant: rhel9
            image_suffix: "-rhel9"
          - variant: rhel10
            image_suffix: "-rhel10"
          - variant: rocky9
            image_suffix: "-rocky9"
          - variant: rocky10
            image_suffix: "-rocky10"

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to Quay.io
        id: quay-login
        continue-on-error: true
        uses: docker/login-action@v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            quay.io/offsec/stalwart
          tags: |
            type=ref,event=tag,suffix=${{ matrix.image_suffix }}
            type=ref,event=branch,prefix=branch-,suffix=${{ matrix.image_suffix }}
            type=raw,value=fdb-${{ needs.detect-fdb.outputs.fdb_version }},suffix=${{ matrix.image_suffix }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=${{ matrix.image_suffix }}

      - name: Create manifest list and push (GHCR)
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ${{ github.repository }}
        run: |
          TAGS=""
          for tag in $(jq -cr --arg repo "$REPO" '.target."docker-metadata-action".tags | map(select(startswith("ghcr.io/" + $repo))) | .[]' ${{ steps.meta.outputs.bake-file }}); do
            TAGS="$TAGS -t $tag"
          done
          DIGESTS=""
          for digest in ghcr-*; do
            DIGESTS="$DIGESTS ghcr.io/$REPO@sha256:${digest#ghcr-}"
          done
          echo "Pushing GHCR: $DIGESTS"
          docker buildx imagetools create $TAGS $DIGESTS

      - name: Create manifest list and push (Quay.io)
        if: steps.quay-login.outcome == 'success'
        working-directory: ${{ runner.temp }}/digests
        env:
          QUAY_REPO: offsec/stalwart
        run: |
          TAGS=""
          for tag in $(jq -cr --arg repo "$QUAY_REPO" '.target."docker-metadata-action".tags | map(select(startswith("quay.io/" + $repo))) | .[]' ${{ steps.meta.outputs.bake-file }}); do
            TAGS="$TAGS -t $tag"
          done
          DIGESTS=""
          for digest in quay-*; do
            DIGESTS="$DIGESTS quay.io/$QUAY_REPO@sha256:${digest#quay-}"
          done
          echo "PENDING Quay: $DIGESTS"
          docker buildx imagetools create $TAGS $DIGESTS

      - name: Inspect images
        env:
          QUAY_OK: ${{ steps.quay-login.outcome }}
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          ghcr_tag=$(jq -cr --arg repo "$GHCR_IMAGE" '.target."docker-metadata-action".tags | map(select(startswith($repo + ":"))) | .[0]' "$BAKE_FILE")
          echo "Inspecting: $ghcr_tag"
          docker buildx imagetools inspect "$ghcr_tag"
          if [ "$QUAY_OK" = "success" ]; then
            quay_tag=$(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("quay.io/"))) | .[0]' "$BAKE_FILE")
            echo "Inspecting: $quay_tag"
            docker buildx imagetools inspect "$quay_tag"
          fi

      - name: Export manifest digest
        id: manifest
        env:
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tag=$(jq -cr --arg repo "$GHCR_IMAGE" '.target."docker-metadata-action".tags | map(select(startswith($repo + ":"))) | .[0]' "$BAKE_FILE")
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" | jq -r '.digest')
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::Unable to resolve digest for $tag"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p ${{ runner.temp }}/manifest-digest
          echo "${digest}" > ${{ runner.temp }}/manifest-digest/ghcr.txt

      - name: Upload manifest digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: manifest-digest-${{ matrix.variant }}
          path: ${{ runner.temp }}/manifest-digest/ghcr.txt
          if-no-files-found: error
          retention-days: 1

      - name: Sign images with Cosign
        env:
          QUAY_OK: ${{ steps.quay-login.outcome }}
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
        run: |
          for tag in $(jq -cr '.target."docker-metadata-action".tags | .[]' "$BAKE_FILE"); do
            case "$tag" in
              quay.io/*) [ "$QUAY_OK" = "success" ] || continue ;;
            esac
            echo "Signing: $tag"
            cosign sign --yes "$tag"
          done

  # ─────────────────────────────────────────────────────
  # Attest build provenance
  # ─────────────────────────────────────────────────────
  attest:
    name: "Attest / ${{ matrix.variant }}"
    needs: [merge, detect-fdb]
    if: github.event_name == 'push' || inputs.push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
          - variant: rhel9
          - variant: rhel10
          - variant: rocky9
          - variant: rocky10

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Download manifest digest
        uses: actions/download-artifact@v8.0.2
        with:
          name: manifest-digest-${{ matrix.variant }}
          path: ${{ runner.temp }}/manifest-digest

      - name: Get manifest digest
        id: digest
        run: |
          GHCR_DIGEST=$(cat "${{ runner.temp }}/manifest-digest/ghcr.txt")
          if [ -z "$GHCR_DIGEST" ] || [ "$GHCR_DIGEST" = "null" ]; then
            echo "::error::No manifest digest found for ${{ matrix.variant }}"
            exit 1
          fi
          echo "ghcr_digest=${GHCR_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@v4.2.2
        if: steps.digest.outputs.ghcr_digest != '' && steps.digest.outputs.ghcr_digest != 'null'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.ghcr_digest }}
          push-to-registry: true
